[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eesyapi"
version = "0.1.0"
description = "Python SDK for the Explore Education Statistics API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pandas"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]